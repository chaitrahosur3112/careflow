name: CareFlow CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  backend-lint-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: careflow_test
          POSTGRES_USER: careflow_user
          POSTGRES_PASSWORD: careflow_pass
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U careflow_user"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install flake8 pytest pytest-django

      - name: Lint (flake8)
        working-directory: backend
        run: flake8 . --max-line-length=120 --exclude=migrations --extend-ignore=E501,W503

      - name: Django system check
        working-directory: backend
        env:
          POSTGRES_HOST: localhost
          POSTGRES_DB: careflow_test
          POSTGRES_USER: careflow_user
          POSTGRES_PASSWORD: careflow_pass
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SECRET_KEY: ci-test-secret-key
        run: python manage.py check

      - name: Run migrations
        working-directory: backend
        env:
          POSTGRES_HOST: localhost
          POSTGRES_DB: careflow_test
          POSTGRES_USER: careflow_user
          POSTGRES_PASSWORD: careflow_pass
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SECRET_KEY: ci-test-secret-key
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate

      - name: Run tests
        working-directory: backend
        env:
          POSTGRES_HOST: localhost
          POSTGRES_DB: careflow_test
          POSTGRES_USER: careflow_user
          POSTGRES_PASSWORD: careflow_pass
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SECRET_KEY: ci-test-secret-key
        run: python manage.py test

  ml-service-lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ml_service/requirements.txt

      - name: Install dependencies
        working-directory: ml_service
        run: |
          pip install -r requirements.txt
          pip install flake8 pytest httpx

      - name: Lint (flake8)
        working-directory: ml_service
        run: flake8 . --max-line-length=120 --extend-ignore=E501,W503

      - name: Run tests
        working-directory: ml_service
        run: pytest -q

  frontend-lint-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

  build-and-push:
    needs: [backend-lint-test, ml-service-lint-test, frontend-lint-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, ml_service, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }} image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}

  # Deploy step is intentionally left as a placeholder — see README's
  # Deployment Strategy section. Wire this to AWS ECS Fargate / EKS
  # once real infrastructure and credentials exist; nothing here should
  # run against production without that setup in place.
  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy (placeholder)
        run: |
          echo "Add your AWS ECS Fargate / Kubernetes deploy step here."
          echo "Images are already pushed to ghcr.io/${{ github.repository }}/<service>:${{ github.sha }}"
