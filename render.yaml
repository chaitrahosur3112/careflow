# Render Blueprint specification for CareFlow
# Deploy via Render Dashboard -> New -> Blueprint -> Select repo: chaitrahosur3112/careflow

databases:
  - name: careflow-db
    databaseName: careflow
    user: careflow_user
    plan: free

services:
  # ---------------------------------------------------------------------------
  # 1. FastAPI ML Microservice
  # ---------------------------------------------------------------------------
  - type: web
    name: careflow-ml
    runtime: python
    rootDir: ml_service
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9

  # ---------------------------------------------------------------------------
  # 2. Django REST Framework & Channels Backend (Daphne ASGI)
  # ---------------------------------------------------------------------------
  - type: web
    name: careflow-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # Free web services do not support preDeployCommand. Run Django's
    # idempotent migrations immediately before starting the single instance.
    startCommand: python manage.py migrate --noinput && daphne -b 0.0.0.0 -p $PORT careflow_project.asgi:application
    healthCheckPath: /kiosk/wait-times
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: DATABASE_URL
        fromDatabase:
          name: careflow-db
          property: connectionString
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: careflow-ml
          property: hostport
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: careflow-redis
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://careflow-frontend.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://careflow-frontend.onrender.com
      - key: SECURE_SSL_REDIRECT
        value: "True"

  # ---------------------------------------------------------------------------
  # 3. React / Vite Frontend (Static Site)
  # ---------------------------------------------------------------------------
  - type: web
    name: careflow-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: careflow-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_WS_BASE_URL
        fromService:
          type: web
          name: careflow-backend
          envVarKey: RENDER_EXTERNAL_URL

  # Shared cache, Channels layer, and Celery broker
  - type: keyvalue
    name: careflow-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off
