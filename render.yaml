# Render Blueprint specification for CareFlow
# Deploy via Render Dashboard -> New -> Blueprint -> Select repo: chaitrahosur3112/careflow

databases:
  - name: careflow-db
    databaseName: careflow
    user: careflow_user
    plan: free

services:
  # ---------------------------------------------------------------------------
  # 1. FastAPI ML Microservice
  # ---------------------------------------------------------------------------
  - type: web
    name: careflow-ml
    runtime: python
    rootDir: ml_service
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9

  # ---------------------------------------------------------------------------
  # 2. Django REST Framework & Channels Backend (Daphne ASGI)
  # ---------------------------------------------------------------------------
  - type: web
    name: careflow-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: daphne -b 0.0.0.0 -p $PORT careflow_project.asgi:application
    healthCheckPath: /kiosk/wait-times
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.9
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost,127.0.0.1,.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: careflow-db
          property: connectionString
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: careflow-ml
          property: url
      - key: CORS_ALLOWED_ORIGINS
        value: https://careflow-frontend.onrender.com,http://localhost:5173,http://localhost:3000
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com,http://localhost:5173,http://localhost:3000
      - key: SECURE_SSL_REDIRECT
        value: "False"
      # Optional: set REDIS_URL from Upstash / Redis Cloud for multi-worker Channels / Celery

  # ---------------------------------------------------------------------------
  # 3. React / Vite Frontend (Static Site)
  # ---------------------------------------------------------------------------
  - type: web
    name: careflow-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: careflow-backend
          property: url
      - key: VITE_WS_BASE_URL
        value: wss://careflow-backend.onrender.com
